name: Build Verity AI

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/verity-ai" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |
          docker build --tag "$IMAGE:v1" .
          docker push "$IMAGE:v1"
          echo "Image: $IMAGE:v1" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and publish
        run: |
          docker buildx imagetools create --tag "$IMAGE:3.1.0" "$IMAGE:v1"
          echo "Image: $IMAGE:3.1.0" >> "$GITHUB_STEP_SUMMARY"
